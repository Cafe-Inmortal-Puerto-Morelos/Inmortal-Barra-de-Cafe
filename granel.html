<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMOR†AL - Barra de Café</title>

    <!-- ========================================== -->
    <!-- FAVICONS Y APPLE TOUCH ICON                -->
    <!-- ========================================== -->
    <!-- Para dispositivos Apple (iPhone/iPad) al añadir a inicio -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    
    <!-- Para la pestaña del navegador (Chrome, Firefox, Safari) -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/icons/favicon.ico">
    
    <!-- Color de la barra de estado en Android -->
    <meta name="theme-color" content="#fdfdfd">

    <!-- ========================================== -->
    <!-- OPEN GRAPH (FACEBOOK, WHATSAPP, LINKEDIN)  -->
    <!-- ========================================== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="INMOR†AL - Barra de Café">
    <meta property="og:description" content="Descubre nuestro menú digital, ubicación y servicios.">
    <!-- IMPORTANTE: Aquí debes poner la URL completa de tu GitHub Pages cuando la tengas -->
    <meta property="og:url" content="https://tu-usuario.github.io/inmortal-hub/">
    <!-- IMPORTANTE: Las redes sociales exigen la URL completa (absoluta) de la imagen, no funciona con "assets/..." -->
    <meta property="og:image" content="https://tu-usuario.github.io/inmortal-hub/assets/icons/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- ========================================== -->
    <!-- TWITTER CARDS                              -->
    <!-- ========================================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="INMOR†AL - Barra de Café">
    <meta name="twitter:description" content="Descubre nuestro menú digital, ubicación y servicios.">
    <meta name="twitter:image" content="https://tu-usuario.github.io/inmortal-hub/assets/icons/og-image.jpg">
    
    <!-- Fuentes e Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:wght@600;900&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <!-- Hoja de estilos externa (Actualizada a la nueva carpeta) -->
     <script src="https://unpkg.com/scrollreveal"></script>
    <link rel="stylesheet" href="styles/styles.css">

    <!-- Script principal como módulo (Actualizado a la nueva carpeta) -->
    <script type="module" src="scripts/main.js" defer></script>
</head>
<body>
    <!-- ========================================== -->
    <!-- MENÚ HAMBURGUESA                           -->
    <!-- ========================================== -->
    <button id="hamburger-btn" class="hamburger-btn" aria-label="Abrir menú">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav id="side-menu" class="side-menu">
        <!-- Botón Regresar -->
        <a href="index.html" class="menu-item">
            <i class="fa-solid fa-arrow-left"></i> 
            <span data-i18n="back">Regresar</span>
        </a>
        
        <!-- Botón Idioma (Mantenemos el ID original) -->
        <button id="lang-toggle" class="menu-item">
            <i class="fa-solid fa-globe"></i> 
            <span data-i18n="language"> EN/ES Idioma</span>
        </button>

        <!-- Botón Modo Oscuro (Mantenemos el ID original) -->
        <button id="theme-toggle" class="menu-item">
            <i class="fa-solid fa-moon"></i> 
            <span data-i18n="theme">Tema</span>
        </button>
    </nav>

    <!-- ========================================== -->
    <!-- ENCABEZADO                                 -->
    <!-- ========================================== -->
    <div class="header">
        <video class="logo-video" autoplay loop muted playsinline>
            <source src="assets/animacion.mp4" type="video/mp4">
        </video>
        <img src="assets/inmortal-texto.svg" alt="Inmortal Barra y Tostador" class="title-img">
        <img src="assets/pm.svg" alt="Puerto Morelos" class="location-img">
    </div>

    <!-- ========================================== -->
    <!-- CONTENEDOR DE PRODUCTOS (GRANEL)           -->
    <!-- ========================================== -->
    <div class="store-container" style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1.5rem; align-items: center; margin-top: 1rem; padding-bottom: 2rem;">
        
        <h2 data-i18n="our_coffee" style="font-family: 'Amatic SC', cursive; font-size: 2rem; text-align: center; letter-spacing: 2px;">
            - Nuestro Café -
        </h2>

        <!-- LISTAS DE PRECIOS FIJAS -->
        <div class="price-lists" style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Asegúrate de comprimir estas imágenes para que carguen rápido -->
            <img src="assets/precio-menudeo.jpeg" alt="Lista de Precios Menudeo" style="width: 100%; border-radius: 8px;">
            <img src="assets/precio-mayoreo.jpeg" alt="Lista de Precios Mayoreo" style="width: 100%; border-radius: 8px;">
        </div>

        <h3 style="font-family: 'Amatic SC', cursive; font-size: 1.8rem; margin-top: 2rem;">
            - Perfiles de Taza -
        </h3>

        <!-- MOSAICO DE CAFÉS (GRID DE 2 COLUMNAS) -->
        <div class="coffee-grid">

            <!-- Ponle la clase 'zoomable' a todas las que quieras que se amplíen -->

            <img src="assets/cafe-oaxaca.jpeg" alt="Café Oaxaca" class="zoomable">

            <img src="assets/cafe-chiapas.jpeg" alt="Café Chiapas" class="zoomable">

            <img src="assets/cafe-veracruz.jpeg" alt="Café Veracruz" class="zoomable">

            <img src="assets/cafe-puebla.jpeg" alt="Café Puebla" class="zoomable">

            <img src="assets/cafe-natural.jpeg" alt="Café Natural" class="zoomable">

            <img src="assets/cafe-maceracion.jpeg" alt="Café Maceración" class="zoomable">

            <img src="assets/cafe-honey.jpeg" alt="Café Honey" class="zoomable">

            <img src="assets/cafe-natural-2.jpeg" alt="Café Natural 2" class="zoomable">

        </div>
    </div> <!-- Cierre del store-container -->

    <!-- ========================================== -->
    <!-- EL LIGHTBOX (Zoom)                         -->
    <!-- ========================================== -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img id="lightbox-img" src="">
    </div>

</body>
</html>
