<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMOR†AL - Barra de Café</title>

    <!-- ========================================== -->
    <!-- FAVICONS Y APPLE TOUCH ICON                -->
    <!-- ========================================== -->
    <!-- Para dispositivos Apple (iPhone/iPad) al añadir a inicio -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    
    <!-- Para la pestaña del navegador (Chrome, Firefox, Safari) -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/icons/favicon.ico">
    
    <!-- Color de la barra de estado en Android -->
    <meta name="theme-color" content="#fdfdfd">

    <!-- ========================================== -->
    <!-- OPEN GRAPH (FACEBOOK, WHATSAPP, LINKEDIN)  -->
    <!-- ========================================== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="INMOR†AL - Barra de Café">
    <meta property="og:description" content="Descubre nuestro menú digital, ubicación y servicios.">
    <!-- IMPORTANTE: Aquí debes poner la URL completa de tu GitHub Pages cuando la tengas -->
    <meta property="og:url" content="https://tu-usuario.github.io/inmortal-hub/">
    <!-- IMPORTANTE: Las redes sociales exigen la URL completa (absoluta) de la imagen, no funciona con "assets/..." -->
    <meta property="og:image" content="https://tu-usuario.github.io/inmortal-hub/assets/icons/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- ========================================== -->
    <!-- TWITTER CARDS                              -->
    <!-- ========================================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="INMOR†AL - Barra de Café">
    <meta name="twitter:description" content="Descubre nuestro menú digital, ubicación y servicios.">
    <meta name="twitter:image" content="https://tu-usuario.github.io/inmortal-hub/assets/icons/og-image.jpg">
    
    <!-- Fuentes e Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:wght@600;900&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <!-- Hoja de estilos externa (Actualizada a la nueva carpeta) -->
    <link rel="stylesheet" href="styles/styles.css">

    <!-- Script principal como módulo (Actualizado a la nueva carpeta) -->
    <script type="module" src="scripts/main.js" defer></script>
</head>
<body>
    <button id="lang-toggle" class="lang-toggle" aria-label="Cambiar idioma">
        EN
    </button>
    <!-- Botón de Modo Oscuro -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="header">
        <img src="assets/calavera.svg" alt="Calavera Inmortal" class="logo-img">
        <img src="assets/inmortal-texto.svg" alt="Inmortal Barra y Tostador" class="title-img">
        <!-- NUEVA CLASE PARA LA TERCERA IMAGEN -->
        <img src="assets/pm.svg" alt="Puerto Morelos" class="location-img">
    </div>
    
    <div class="links-container">
        
        <a href="assets/menu.pdf" target="_blank" rel="noopener noreferrer" class="link-btn">
            <div class="icon-wrapper">
                <img src="assets/icono-calavera.svg" alt="Menú" class="custom-icon">
            </div>
            <div class="text-wrapper brush-1">
                <span data-i18n="menu">Menú Digital</span>
            </div>
        </a>
        <a href="https://maps.app.goo.gl/hvdMJ1LeCc3p4hW59" target="_blank" rel="noopener noreferrer" class="link-btn">
            <div class="icon-wrapper">
                <i class="fa-solid fa-star"></i>
            </div>
            <div class="text-wrapper brush-3">
                <span data-i18n="review">Déjanos una reseña</span>
            </div>
        </a>

        <a href="https://www.instagram.com/inmortalcafe?igsh=YnFuOTExNTFsNTF0" target="_blank" rel="noopener noreferrer" class="link-btn">
            <div class="icon-wrapper">
                <i class="fa-brands fa-instagram"></i>
            </div>
            <div class="text-wrapper brush-2">
                Instagram
            </div>
        </a>

        <a href="https://www.facebook.com/share/1DVLbSd2Kc/" target="_blank" rel="noopener noreferrer" class="link-btn">
            <div class="icon-wrapper">
                <i class="fa-brands fa-facebook"></i>
            </div>
            <div class="text-wrapper brush-1">
                Facebook
            </div>
        </a>
        
        <a href="#" id="wifi-btn" class="link-btn">
            <div class="icon-wrapper">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <div class="text-wrapper brush-2">
                <span data-i18n="wifi">Conectarse al Wi-Fi</span>
            </div>
        </a>
        <a href="https://wa.me/1234567890" target="_blank" rel="noopener noreferrer" class="link-btn">
            <div class="icon-wrapper">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div class="text-wrapper brush-1">
                <span data-i18n="phone">Escríbenos por WhatsApp</span>
            </div>
        </a>

    </div>
    <div class="footer">
        <p><i class="fa-solid fa-microchip"></i> Powered by NFC</p>
    </div>

</body>
</html>
